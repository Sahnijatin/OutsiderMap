name: android-build

# Builds an installable Android **debug APK** entirely in the cloud (Linux) — no
# Mac, no local Android SDK needed. Because the app is a Capacitor *hybrid*
# (the native shell just loads the hosted web app via CAP_SERVER_URL), the
# native `android/` project is fully determined by capacitor.config.ts, so CI
# generates it fresh each run instead of committing it (see MOBILE_PLAN.md §6).
#
# Output: an `app-debug.apk` artifact you can sideload onto any Android device
# to smoke-test the real native shell. No signing / no Play account required.
#
# Trigger: manual (Run workflow), and on pushes that touch the shell/config.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          Hosted app URL the native shell loads (hybrid). Defaults to the
          CAP_SERVER_URL repo variable, then production.
        required: false
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "mobile-shell/**"
      - "src/components/capacitor-init.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  # Also validate the APK build on PRs that touch the native shell/config/deps,
  # so a broken shell is caught in review. Linux + debug build → cheap enough to
  # gate on. (iOS stays manual-only: macOS runner minutes cost ~10x.)
  pull_request:
    paths:
      - "capacitor.config.ts"
      - "mobile-shell/**"
      - "src/components/capacitor-init.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Hybrid shell target, in priority order: manual input → repo variable →
      # production URL. Keep the fallback in sync with capacitor.config default.
      CAP_SERVER_URL: >-
        ${{ github.event.inputs.server_url
            || vars.CAP_SERVER_URL
            || 'https://www.outsidermap.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      # Generate the native Android project fresh from capacitor.config.ts, then
      # copy web assets + plugins into it. Idempotent: `add` is skipped if the
      # folder already exists (it won't in CI — android/ is git-ignored).
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
