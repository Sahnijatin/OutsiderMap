name: ios-testflight

# Builds a SIGNED iOS app in the cloud and uploads it to TestFlight — no Mac
# required. Uses App Store Connect API-key authentication so xcodebuild can do
# automatic signing (create/download the distribution cert + provisioning
# profile on the runner) and altool can upload, all headless.
#
# Prerequisites (one-time, see MOBILE_PLAN.md §3 / the setup checklist):
#   * Apple Developer Program enrollment.
#   * App ID `com.outsidermap.app` registered (Sign in with Apple capability).
#   * The app created in App Store Connect with that bundle ID.
#   * These repo secrets:
#       APP_STORE_CONNECT_API_KEY       — contents of the AuthKey_XXXX.p8
#       APP_STORE_CONNECT_KEY_ID        — the key's Key ID
#       APP_STORE_CONNECT_ISSUER_ID     — the API Issuer ID
#       APPLE_TEAM_ID                   — the 10-char Team ID
#   * Optional CAP_SERVER_URL repo variable (the hosted app the shell loads).
#
# Manual-only: TestFlight builds are deliberate, and macOS runner minutes cost
# ~10x. Trigger via Actions → ios-testflight → Run workflow.
#
# NOTE: this is the first-run scaffold. Cloud iOS signing has fiddly edges
# (automatic-signing permissions, export method names) that can only be shaken
# out against a real account — expect to iterate on the first live run.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: >-
          Hosted app URL the native shell loads. Defaults to the CAP_SERVER_URL
          repo variable, then production.
        required: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CAP_SERVER_URL: >-
        ${{ github.event.inputs.server_url
            || vars.CAP_SERVER_URL
            || 'https://www.outsidermap.com' }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.outsidermap.app
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID \
                      APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repo secret: $name"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || {
            echo "Add the Apple secrets first (see the workflow header)."
            exit 1
          }
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios
          node scripts/cap-native-permissions.mjs

      - name: Generate app icons + splash screens
        run: npx capacitor-assets generate --ios

      # Place the API key where both xcodebuild (-authenticationKeyPath) and
      # altool (auto-discovery) can find it.
      - name: Install App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys" ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          cp "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/

      # A unique, increasing build number every run (TestFlight rejects repeats).
      - name: Archive (signed, automatic signing via API key)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export signed IPA
        working-directory: ios/App
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 14
