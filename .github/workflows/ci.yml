# Typecheck / lint / test / build for the web app and typecheck / lint /
# bundle for the Expo app, on every PR and push to main. The two apps have
# separate toolchains (see root tsconfig.json / mobile/), so they run as
# separate jobs.

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vercel silently rejects deployments whose vercel.json breaks plan
      # limits (that pinned prod at an old build once) - fail it here instead.
      - name: Validate vercel.json (Hobby plan limits)
        run: node scripts/check-vercel-config.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Placeholder public env keeps static generation from tripping on
      # missing env; no real secrets are needed to build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Bundle (expo export)
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export
        env:
          CI: "1"
