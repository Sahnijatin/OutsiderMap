# Typecheck / lint / test / build for the web app, on every PR and push to main.
#
# The old Expo app in `mobile/` no longer has a job here: it was retired when the
# native apps moved to Capacitor (#143), and its typecheck/lint/`expo export`
# were spending CI minutes on code we no longer ship. The directory is kept for
# reference (retire-not-delete) — the shipping native builds are
# android-build.yml, ios-build-check.yml and ios-testflight.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vercel silently rejects deployments whose vercel.json breaks plan
      # limits (that pinned prod at an old build once) - fail it here instead.
      - name: Validate vercel.json (Hobby plan limits)
        run: node scripts/check-vercel-config.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Placeholder public env keeps static generation from tripping on
      # missing env; no real secrets are needed to build.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
